# Cluster subset: the pulp_cluster set + every idma and tcdm test, all at cores=8.
# The idma entries live only in the idma_tests group so no directory is built twice
# concurrently (each command starts with `make clean`).

pulp_cluster:
  parMatrixMul8:
    path: ./parallel_bare_tests/parMatrixMul8
    command: make clean all run cores=8
  parMatrixMul16:
    path: ./parallel_bare_tests/parMatrixMul16
    command: make clean all run cores=8
  parMatrixMul32:
    path: ./parallel_bare_tests/parMatrixMul32
    command: make clean all run cores=8
  FP16:
    path: ./fpu_tests/matmul/FP16
    command: make clean all run cores=8
  FP16ALT:
    path: ./fpu_tests/matmul/FP16ALT
    command: make clean all run cores=8
  FP32:
    path: ./fpu_tests/matmul/FP32
    command: make clean all run cores=8
  redmule:
    path: ./hwpe/redmule
    command: make clean all run cores=8
  neureka:
    path: ./hwpe/neureka
    command: make clean all run cores=8
  softex:
    path: ./hwpe/softex
    command: make clean all run cores=8

idma_tests:
  idma_multi_core:
    path: ./idma_tests/idma_multi_core
    command: make clean all run cores=8 QUICK_MODE=1
  idma_multi_core_2d:
    path: ./idma_tests/idma_multi_core_2d
    command: make clean all run cores=8 QUICK_MODE=1
  idma_multi_core_3d:
    path: ./idma_tests/idma_multi_core_3d
    command: make clean all run cores=8 QUICK_MODE=1
  idma_max_size_transfer:
    path: ./idma_tests/idma_max_size_transfer
    command: make clean all run cores=8
  idma_benchmark_tests:
    path: ./idma_tests/idma_benchmark_tests
    command: make clean all run cores=8 TX_RX=1

tcdm_tests:
  L1_check:
    path: ./tcdm_tests/L1_check
    command: make clean all run cores=8
  L1_control_check:
    path: ./tcdm_tests/L1_control_check
    command: make clean all run cores=8
  L2_check:
    path: ./tcdm_tests/L2_check
    command: make clean all run cores=8
